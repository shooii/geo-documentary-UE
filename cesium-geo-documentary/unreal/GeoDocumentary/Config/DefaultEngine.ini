[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/GeoDocumentary.GeoGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.AntiAliasingMethod=2
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0

[/Script/Engine.Engine]
bUseFixedFrameRate=False

[SystemSettings]
r.ScreenPercentage=100
r.VSync=0
t.MaxFPS=30
PixelStreaming2.WebRTC.Fps=30

; --- Native volumetric clouds (1.5 km -> 3.5 km deck) ------------------------
; Temporal volumetric render target replaces the raw half-res pass: this is the
; single biggest fix for the stair-stepping seen while flying through the deck.
r.VolumetricCloud=1
r.VolumetricCloud.Support=1
r.VolumetricRenderTarget=1
r.VolumetricRenderTarget.Mode=1
r.VolumetricRenderTarget.UpsamplingMode=1
r.VolumetricRenderTarget.Scale=1
r.VolumetricRenderTarget.PreferAsyncCompute=0

; Ray budget: keep the minimum high enough that thin shells stop shimmering.
r.VolumetricCloud.ViewRaySampleMaxCount=128
r.VolumetricCloud.SampleMinCount=2
r.VolumetricCloud.ReflectionRaySampleMaxCount=12
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=32
r.VolumetricCloud.EmptySpaceSkipping=1
r.VolumetricCloud.AllowAnalyticDerivatives=1

; Cached cloud shadow / sky AO so the deck stops lighting itself per pixel.
r.VolumetricCloud.ShadowMap=1
r.VolumetricCloud.ShadowMap.MaxResolution=1024
r.VolumetricCloud.ShadowMap.SpatialFiltering=1
r.VolumetricCloud.SkyAO=1
r.VolumetricCloud.SkyAO.MaxResolution=512
r.VolumetricCloud.SkyAO.Filtering=1

; Washed-out white clouds: local light sampling inside the volume is what turns
; the interior into flat milk; keep it off and let sky/aerial perspective own it.
r.VolumetricCloud.EnableLocalLightsSampling=0
r.VolumetricCloud.EnableDistantSkyLightSampling=1
r.VolumetricCloud.EnableAerialPerspectiveSampling=1
r.VolumetricCloud.ApplyFogLate=1
r.VolumetricCloud.SoftBlendingDistanceOnTranslucent=1

; TAA keeps the volumetric history stable at the 30 fps stream rate.
r.AntiAliasingMethod=2
r.TemporalAA.Upsampling=1
r.TemporalAA.Algorithm=0
